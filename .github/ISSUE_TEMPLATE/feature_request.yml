name: Feature or content request
description: Suggest an improvement, new content or a translation fix
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is it useful for visitors or for the project?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
